<div style="max-width:980px;margin:28px auto;font-family:Arial;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2>DevStream Deployments</h2>
        <button (click)="logout()" style="padding:8px 12px;">Logout</button>
    </div>

    <div *ngIf="error" style="color:red;margin:10px 0;">{{ error }}</div>

    <div style="border:1px solid #ddd;border-radius:8px;padding:14px;margin:16px 0;">
        <h3 style="margin-top:0;">Create Deployment</h3>

        <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <input placeholder="Service (e.g., claims-service)" [(ngModel)]="form.serviceName"
                style="flex:1;min-width:220px;padding:10px;" />
            <input placeholder="Version (e.g., 1.0.0)" [(ngModel)]="form.version" style="width:160px;padding:10px;" />

            <select [(ngModel)]="form.environment" style="width:140px;padding:10px;">
                <option value="dev">dev</option>
                <option value="stage">stage</option>
                <option value="prod">prod</option>
            </select>

            <select [(ngModel)]="form.status" style="width:160px;padding:10px;">
                <option value="QUEUED">QUEUED</option>
                <option value="RUNNING">RUNNING</option>
                <option value="SUCCESS">SUCCESS</option>
                <option value="FAILED">FAILED</option>
            </select>

            <button (click)="create()" style="padding:10px 14px;">Create</button>
        </div>
    </div>

    <table style="width:100%;border-collapse:collapse;">
        <thead>
            <tr style="text-align:left;border-bottom:1px solid #ddd;">
                <th style="padding:10px;">Service</th>
                <th style="padding:10px;">Version</th>
                <th style="padding:10px;">Env</th>
                <th style="padding:10px;">Status</th>
                <th style="padding:10px;">Created</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let d of deployments" style="border-bottom:1px solid #f0f0f0;">
                <td style="padding:10px;">{{ d.serviceName }}</td>
                <td style="padding:10px;">{{ d.version }}</td>
                <td style="padding:10px;">{{ d.environment }}</td>
                <td style="padding:10px;">{{ d.status }}</td>
                <td style="padding:10px;">{{ d.createdAtUtc }}</td>
            </tr>
        </tbody>
    </table>
</div>
